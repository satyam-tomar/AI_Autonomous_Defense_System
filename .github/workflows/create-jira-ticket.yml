name: Create Jira Ticket

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  create-ticket:
    runs-on: ubuntu-latest
    environment: jira
    permissions:
      pull-requests: write

    steps:
      - name: Create or Update Jira Issue
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REPO_NAME: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look for our marker "Jira: KAN-N" in the PR description
          # This is written by us when a ticket is first created
          EXISTING_KEY=$(echo "${PR_BODY}" | grep -oE 'Jira: [A-Z]+-[0-9]+' | grep -oE '[A-Z]+-[0-9]+' | head -1)

          if [ -n "$EXISTING_KEY" ]; then
            echo "Found existing Jira ticket ${EXISTING_KEY} in PR description — adding update comment."

            COMMENT_TEXT=$(printf "PR #%s updated by %s\n\nBranch: %s -> %s\nURL: %s\n\n%s" \
              "${PR_NUMBER}" "${PR_AUTHOR}" "${PR_BRANCH}" "${PR_BASE}" "${PR_URL}" \
              "${PR_BODY:-No description provided.}")

            COMMENT_PAYLOAD=$(jq -n \
              --arg text "$COMMENT_TEXT" \
              '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [{type: "text", text: $text}]}]}}')

            RESPONSE=$(curl -s -X POST \
              -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://${JIRA_SITE}/rest/api/3/issue/${EXISTING_KEY}/comment" \
              --data "$COMMENT_PAYLOAD")

            echo "Comment added to ${EXISTING_KEY}:"
            echo "$RESPONSE"
            exit 0
          fi

          echo "No existing Jira ticket found — creating new ticket."

          DESCRIPTION=$(printf "Repository: %s\nBranch: %s -> %s\nAuthor: %s\nPR URL: %s\n\nDescription:\n%s" \
            "${REPO_NAME}" "${PR_BRANCH}" "${PR_BASE}" "${PR_AUTHOR}" "${PR_URL}" \
            "${PR_BODY:-No description provided.}")

          PAYLOAD=$(jq -n \
            --arg summary "PR #${PR_NUMBER} - ${PR_TITLE}" \
            --arg description "$DESCRIPTION" \
            '{
              fields: {
                project: {key: "KAN"},
                summary: $summary,
                description: {
                  type: "doc",
                  version: 1,
                  content: [{
                    type: "paragraph",
                    content: [{type: "text", text: $description}]
                  }]
                },
                issuetype: {name: "Task"}
              }
            }')

          CREATE_RESPONSE=$(curl -s -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://${JIRA_SITE}/rest/api/3/issue" \
            --data "$PAYLOAD")

          echo "Create response: $CREATE_RESPONSE"

          TICKET_KEY=$(echo "$CREATE_RESPONSE" | jq -r '.key // empty')

          if [ -z "$TICKET_KEY" ]; then
            echo "Failed to extract ticket key from Jira response."
            exit 1
          fi

          echo "Ticket ${TICKET_KEY} created. Updating PR title and description..."

          # Prepend Jira key to PR title — GitHub for Atlassian scans PR titles reliably
          NEW_TITLE=$(printf "[%s] %s" "${TICKET_KEY}" "${PR_TITLE}")

          # Append Jira marker to PR description — our workflow reads this on future runs
          UPDATED_BODY=$(printf "%s\n\n---\nJira: %s" "${PR_BODY:-}" "${TICKET_KEY}")

          curl -s -X PATCH \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO_NAME}/pulls/${PR_NUMBER}" \
            --data "$(jq -n --arg title "$NEW_TITLE" --arg body "$UPDATED_BODY" '{title: $title, body: $body}')" > /dev/null

          echo "PR #${PR_NUMBER} title updated to: ${NEW_TITLE}"
          echo "PR #${PR_NUMBER} description updated with Jira marker."
