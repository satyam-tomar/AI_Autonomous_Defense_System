name: Create Jira Ticket

on:
  pull_request:
    types: [opened]

jobs:
  create-ticket:
    runs-on: ubuntu-latest

    steps:
      - name: Debug secrets
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
        run: |
          echo "JIRA_EMAIL length: ${#JIRA_EMAIL}"
          echo "JIRA_API_TOKEN length: ${#JIRA_API_TOKEN}"
          echo "JIRA_SITE value: ${JIRA_SITE}"

      - name: Create Jira Issue
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          SUMMARY="PR #${PR_NUMBER} - ${PR_TITLE}"
          PAYLOAD=$(jq -n \
            --arg summary "$SUMMARY" \
            '{fields: {project: {key: "KAN"}, summary: $summary, issuetype: {name: "Task"}}}')

          RESPONSE=$(curl -s -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://${JIRA_SITE}/rest/api/3/issue" \
            --data "$PAYLOAD")

          echo "$RESPONSE"
