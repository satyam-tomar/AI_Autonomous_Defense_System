name: Create Jira Ticket

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  create-ticket:
    runs-on: ubuntu-latest
    environment: jira
    permissions:
      pull-requests: write

    steps:
      - name: Create or Update Jira Issue
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REPO_NAME: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |

          # ==============================================================
          # OPENED — new PR, always create a fresh Jira ticket.
          # Only skip if our workflow already ran (title has [KAN-N] prefix).
          # We deliberately ignore any Jira key in the description because
          # auto-created PRs copy the old description which contains the
          # previous PR's Jira marker — that must not block ticket creation.
          # ==============================================================
          if [ "$EVENT_ACTION" = "opened" ]; then

            ALREADY_TAGGED=$(echo "${PR_TITLE}" | grep -oE '^\[[A-Z]+-[0-9]+\]' | head -1)
            if [ -n "$ALREADY_TAGGED" ]; then
              echo "PR title already tagged with Jira key — workflow already ran. Skipping."
              exit 0
            fi

            echo "New PR opened — creating Jira ticket."

            DESCRIPTION=$(printf "Repository: %s\nBranch: %s -> %s\nAuthor: %s\nPR URL: %s\n\nDescription:\n%s" \
              "${REPO_NAME}" "${PR_BRANCH}" "${PR_BASE}" "${PR_AUTHOR}" "${PR_URL}" \
              "${PR_BODY:-No description provided.}")

            PAYLOAD=$(jq -n \
              --arg summary "PR #${PR_NUMBER} - ${PR_TITLE}" \
              --arg description "$DESCRIPTION" \
              '{
                fields: {
                  project: {key: "KAN"},
                  summary: $summary,
                  description: {
                    type: "doc",
                    version: 1,
                    content: [{
                      type: "paragraph",
                      content: [{type: "text", text: $description}]
                    }]
                  },
                  issuetype: {name: "Task"}
                }
              }')

            CREATE_RESPONSE=$(curl -s -X POST \
              -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://${JIRA_SITE}/rest/api/3/issue" \
              --data "$PAYLOAD")

            echo "Create response: $CREATE_RESPONSE"

            TICKET_KEY=$(echo "$CREATE_RESPONSE" | jq -r '.key // empty')
            if [ -z "$TICKET_KEY" ]; then
              echo "Failed to extract ticket key from Jira response."
              exit 1
            fi

            echo "Ticket ${TICKET_KEY} created. Updating PR..."

            # Prepend [KAN-N] to PR title — GitHub for Atlassian scans titles reliably
            NEW_TITLE=$(printf "[%s] %s" "${TICKET_KEY}" "${PR_TITLE}")

            # Strip any stale Jira marker copied from a previous PR description,
            # then append the fresh one for this PR's ticket
            CLEAN_BODY=$(printf "%s" "${PR_BODY:-}" | grep -v '^Jira: [A-Z]*-[0-9]' | grep -v '^---$' | sed '/^[[:space:]]*$/{ N; /^\n*$/d }')
            UPDATED_BODY=$(printf "%s\n\n---\nJira: %s" "${CLEAN_BODY}" "${TICKET_KEY}")

            curl -s -X PATCH \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO_NAME}/pulls/${PR_NUMBER}" \
              --data "$(jq -n --arg title "$NEW_TITLE" --arg body "$UPDATED_BODY" '{title: $title, body: $body}')" > /dev/null

            echo "PR #${PR_NUMBER} title: ${NEW_TITLE}"
            echo "PR #${PR_NUMBER} description updated with fresh Jira marker."
            exit 0
          fi

          # ==============================================================
          # SYNCHRONIZE / REOPENED — existing PR, find ticket and comment.
          # Check PR title first ([KAN-N] prefix), then description fallback.
          # ==============================================================
          EXISTING_KEY=$(echo "${PR_TITLE}" | grep -oE '^\[[A-Z]+-[0-9]+\]' | grep -oE '[A-Z]+-[0-9]+' | head -1)

          if [ -z "$EXISTING_KEY" ]; then
            EXISTING_KEY=$(echo "${PR_BODY}" | grep -oE 'Jira: [A-Z]+-[0-9]+' | grep -oE '[A-Z]+-[0-9]+' | head -1)
          fi

          if [ -z "$EXISTING_KEY" ]; then
            echo "No Jira ticket linked to this PR — nothing to update."
            exit 0
          fi

          echo "Found Jira ticket ${EXISTING_KEY} — adding update comment."

          COMMENT_TEXT=$(printf "PR #%s updated by %s\n\nBranch: %s -> %s\nURL: %s\n\nLatest description:\n%s" \
            "${PR_NUMBER}" "${PR_AUTHOR}" "${PR_BRANCH}" "${PR_BASE}" "${PR_URL}" \
            "${PR_BODY:-No description provided.}")

          COMMENT_PAYLOAD=$(jq -n \
            --arg text "$COMMENT_TEXT" \
            '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [{type: "text", text: $text}]}]}}')

          RESPONSE=$(curl -s -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://${JIRA_SITE}/rest/api/3/issue/${EXISTING_KEY}/comment" \
            --data "$COMMENT_PAYLOAD")

          echo "Comment added to ${EXISTING_KEY}:"
          echo "$RESPONSE"
